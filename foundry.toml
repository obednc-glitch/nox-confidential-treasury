[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@iexec-nox/nox-protocol-contracts/=node_modules/@iexec-nox/nox-protocol-contracts/",
]

[rpc_endpoints]
# Fill in with whichever testnet the hackathon targets (Nox is chain-agnostic
# per their docs — confirm which network they want submissions deployed to).
testnet = "${TESTNET_RPC_URL}"

[etherscan]
testnet = { key = "${ETHERSCAN_API_KEY}" }
